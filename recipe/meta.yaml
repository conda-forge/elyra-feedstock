{% set name = "elyra" %}
{% set version = "4.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/elyra-{{ version }}.tar.gz
  sha256: ddc27d0881fb1906572084c3e414530bfde9db86f3050146705f636b95018a5e

build:
  noarch: python
  entry_points:
    - elyra-metadata = elyra.metadata.metadata_app:MetadataApp.main
    - elyra-pipeline = elyra.cli.pipeline_app:pipeline
    - jupyter-elyra = elyra.elyra_app:launch_instance
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }}
    - autopep8 >=1.5.0
    - black >=26.1,<27.0
    - click ==8.1.8
    - colorama
    - deprecation
    - entrypoints >=0.3
    - jinja2 >=3
    - jsonschema >=3.2.0
    - jupyter-ai >=2.0.0,<3.0.0
    - jupyter_client >=7.4.9
    - jupyter_core >=5.3.1
    - jupyter_events >=0.7.0
    - jupyter-packaging >=0.12.3
    - jupyter-resource-usage >=1.1.0,<1.2.0
    - jupyter_server >=2.7.3
    - jupyterlab >=4.4,<5.0
    - jupyterlab-git >=0.52.0,<0.53.0
    - jupyterlab-lsp >=5.1.0,<5.2.0
    - jupyterlab-magic-wand >=0.1.0
    - kfp >=2.0.0
    - kfp-kubernetes >=1.0.0
    - markupsafe >=2.1
    - minio >=7.0.0,!=7.2.1
    - nbclient >=0.10.0
    - nbconvert >=6.5.1
    - nbdime >=4.0.1,<4.1.0
    - nbformat >=5.1.2
    - networkx >=2.5.1
    - papermill >=2.3.4
    - pygithub
    - python-lsp-server >=1.11.0
    - flake8 >=7.1
    - mccabe >=0.7.0
    - pycodestyle >=2.12.0
    - pydocstyle >=6.3.0
    - pyflakes >=3.2.0
    - pylint >=3.1
    - rope >=1.11.0
    - whatthepatch >=1.0.2
    - yapf >=0.33.0
    - pyyaml >=5.3.1
    - requests >=2.31
    - rfc3986-validator >=0.1.1
    - tornado >=6.1.0
    - traitlets >=4.3.2
    - typing-extensions >=3.10
    - urllib3 >=2.5.0
    - watchdog >=2.1.3
    - websocket-client
    - yaspin

test:
  imports:
    - elyra
  commands:
    - pip check
    - python -c "from elyra.metadata.metadata_app import MetadataApp"
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/elyra-ai/elyra
  dev_url: https://github.com/elyra-ai/elyra
  doc_url: https://elyra.readthedocs.io/en/latest
  doc_source_url: https://github.com/elyra-ai/elyra/tree/main/docs
  license: Apache-2.0
  license_file: LICENSE
  summary: Elyra, a set of AI-centric extensions for JupyterLab Notebooks.
  description: >
    Elyra currently includes: Notebook Pipelines visual editor Ability to run a notebook as a batch job Hybrid runtime support Python script execution capabilities within the editor Reusable Code Snippets (Experimental) Notebook versioning based on git integration Notebook navigation using auto-generated Table of Contents
    Reusable configuration for runtimes

extra:
  recipe-maintainers:
    - akchinSTC
    - kevin-bates
    - lresende
